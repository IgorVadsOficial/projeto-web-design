<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ShopTech</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="shortcut icon" href="medias/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="cabecalho">
      <section>
        <ul class="navegacao">
          <li class="home">
            <a href="index.html">
              <img src="medias/programming.png" alt="Logo da ShopTech" />
            </a>
          </li>

          <li class="cep">
            <form id="form-cep">
              <label for="cep">
                <img src="medias/maps-and-flags.png" alt="" />
                <strong style="text-decoration: underline">
                  Digite o CEP:
                </strong>
              </label>

              <br />

              <input
                type="text"
                id="cep"
                name="cep"
                placeholder="00000-000"
                maxlength="9"
                size="9"
                inputmode="numeric"
                pattern="[0-9]{5}-?[0-9]{3}"
                required
              />

              <button type="submit">OK</button>
            </form>
          </li>

          <li>
            <form class="barra-busca" action="#" method="get">
              <input
                type="search"
                name="busca"
                placeholder="Procurar"
                aria-label="Buscar produtos"
              />

              <button type="submit" aria-label="Buscar">🔍</button>
            </form>
          </li>

          <li class="login">
            <img src="medias/login.png" alt="" />

            <a href="login.html" class="linklogin">
              <strong style="text-decoration: underline"> Entre </strong>
            </a>

            ou

            <br />

            <a href="register.html">
              <strong style="text-decoration: underline"> Cadastre-se </strong>
            </a>
          </li>

          <li>
            <button class="carrinho">
              <a href="carrinho.html">
                Carrinho
                <img src="medias/cart.png" alt="" />
              </a>
            </button>
          </li>
        </ul>

        <nav class="generos">
          <ul>
            <li><a href="informatica.html">Informática</a></li>
            <li><a href="eletrodomesticos.html">Eletrodomésticos</a></li>
            <li><a href="smartphones.html">Smartphones</a></li>
            <li><a href="tv.html">TV e Vídeo</a></li>
          </ul>
        </nav>
      </section>
    </header>
    <main class="pagina-login">
      <fieldset>
        <img src="medias/programming.png" alt="Logo da ShopTech" />

        <div>
          <h1>Login</h1>
        </div>

        <form action="#" method="post">
          <label for="email">E-mail</label>

          <br />

          <input
            type="email"
            name="email"
            id="email"
            placeholder="Digite o seu e-mail"
            autocomplete="email"
            required
          />

          <br />

          <label for="pwd">Senha</label>

          <br />

          <input
            type="password"
            name="pwd"
            id="pwd"
            placeholder="Digite a sua senha"
            autocomplete="current-password"
            required
          />

          <br />

          <button type="submit">Entrar</button>
        </form>

        <p>
          Ainda não tem conta?
          <a href="register.html">Cadastre-se</a>
        </p>
      </fieldset>
    </main>

    <footer class="rodape">
      <div class="rodape-conteudo">
        <p class="rodape-marca"><a href="index.html">ShopTech</a></p>

        <ul class="rodape-links">
          <li><a href="informatica.html">Informática</a></li>
          <li><a href="eletrodomesticos.html">Eletrodomésticos</a></li>
          <li><a href="smartphones.html">Smartphones</a></li>
          <li><a href="tv.html">TV e Video</a></li>
        </ul>

        <p class="rodape-copy">
          © 2026 ShopTech. Todos os direitos reservados.
        </p>
      </div>
    </footer>
  </body>
</html>
